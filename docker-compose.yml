# Local Neo4j 5 (LTS) with the Graph Data Science plugin.
# The password is read from NEO4J_PASSWORD in the .env file next to this file.
#   Start:  docker compose up -d
#   Stop:   docker compose down
#   Browser UI: http://localhost:7474
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: research-gap-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt (used by the backend)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      # Keep transaction logs small for a tiny demo database
      NEO4J_db_tx__log_rotation_retention__policy: 100M size
    volumes:
      - ./neo4j_data:/data
    restart: unless-stopped
